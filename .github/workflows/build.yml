          """
          raw = gzip.decompress(base64.b64decode(B64_DATA)).decode("utf-8")
          data = json.loads(raw)
          changed = False
          for rel_path, text in data.items():
              p = Path(rel_path)
              content = text.encode("utf-8")
              if not p.exists() or p.read_bytes() != content:
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(content)
                  changed = True
          if changed:
              print("Project files bootstrapped:", len(data))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add NguonC CloudStream plugin source files [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build CloudStream Plugin
        run: |
          gradle make makePluginsJson

      - name: Stage build artifacts
        run: |
          mkdir -p dist
          find . -path '*/build/*.cs3' -type f -exec cp {} dist/ ;
          cp build/plugins.json dist/plugins.json
          cp repo.json dist/repo.json
          ls -la dist/

      - name: Publish to builds branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./dist
          keep_files: false
